# deploy/alerts.yml
groups:
  - name: app
    rules:
      - alert: HighErrorRatio
        expr: |
          sum(rate(http_requests_total{job="app",status=~"5.."}[5m]))
            / sum(rate(http_requests_total{job="app"}[5m])) > 0.05
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "More than 5% of requests are failing"
      - alert: AppDown
        expr: up{job="app"} == 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "Prometheus cannot scrape the app"